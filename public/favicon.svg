  </style>
  <rect class="tile" width="64" height="64" rx="14"/>
  <text class="letters" x="32" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700">EN</text>
</svg>
